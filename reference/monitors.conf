# Alienware monitor (right, main)
monitor=DP-2,3440x1440@175,0x0,1,vrr,2

# Philips monitor (left, portrait)
# monitor=DP-1,3840x2160@60,-1440x0,1.5,transform,3  (Portrait Mode)
monitor=DP-1,3840x2160@60,-2560x0,1.5

# Main monitor (DP-2 Alienware) - Workspaces 1-4
workspace = 1, monitor:DP-2, default:true
workspace = 2, monitor:DP-2
#workspace = 3, monitor:DP-2

# Left monitor (DP-1 Philips Portrait) - Workspaces 5-8
workspace = 3, monitor:DP-1, default:true
workspace = 4, monitor:DP-1
workspace = 5, monitor:DP-1

# Force all games to main monitor (DP-2)
windowrulev2 = monitor DP-2, class:^(steam_app_.*)$
windowrulev2 = monitor DP-2, class:^(gamescope)$

# Steam notification fix - use absolute positioning for Dell monitor
windowrulev2 = monitor DP-2, class:^(steam)$, title:^(notificationtoasts).*
windowrulev2 = move 3100 50, class:^(steam)$, title:^(notificationtoasts).*
windowrulev2 = size 283 70, class:^(steam)$, title:^(notificationtoasts).*
windowrulev2 = float, class:^(steam)$, title:^(notificationtoasts).*
windowrulev2 = pin, class:^(steam)$, title:^(notificationtoasts).*

# General steam rules (less specific, so come after)
windowrulev2 = monitor DP-2, class:^(steam)$
windowrulev2 = workspace 2, class:^(steam)$
windowrulev2 = workspace 2, class:^(steam_app_.*)$
windowrulev2 = workspace 2, class:^(gamescope)$

# Gaming performance optimizations
windowrulev2 = immediate, class:^(steam_app_.*)$         # Enable tearing for games (reduces input lag)
windowrulev2 = immediate, class:^(gamescope)$
windowrulev2 = noborder, class:^(steam_app_.*)$, fullscreen:1    # Remove borders in fullscreen
windowrulev2 = noborder, class:^(gamescope)$, fullscreen:1
windowrulev2 = noblur, class:^(steam_app_.*)$            # Disable blur for games
windowrulev2 = noblur, class:^(gamescope)$
windowrulev2 = noshadow, class:^(steam_app_.*)$          # Disable shadows for games
windowrulev2 = noshadow, class:^(gamescope)$
