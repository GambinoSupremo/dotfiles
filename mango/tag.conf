# Tag configuration
# Available layouts: tile, scroller, grid, deck, monocle, center_tile,
#                    vertical_tile, right_tile, vertical_scroller,
#                    vertical_grid, vertical_deck, tgmix
#
# NOTE: rules match ^DP-2$/^DP-1$ only. The NVIDIA DP index flips with
# GPU probe order (DP-4/DP-3 have been seen); monitor.conf covers both
# names but these tagrules don't — layouts fall back to default if the
# names flip.

# ============================================
# DP-2 - Alienware Ultrawide (primary)
# ============================================
tagrule=id:1,monitor_name:^DP-2$,layout_name:scroller
tagrule=id:2,monitor_name:^DP-2$,layout_name:scroller
tagrule=id:3,monitor_name:^DP-2$,layout_name:scroller
tagrule=id:4,monitor_name:^DP-2$,layout_name:scroller
tagrule=id:5,monitor_name:^DP-2$,layout_name:scroller
tagrule=id:6,monitor_name:^DP-2$,layout_name:scroller
tagrule=id:7,monitor_name:^DP-2$,layout_name:scroller
tagrule=id:8,monitor_name:^DP-2$,layout_name:scroller
tagrule=id:9,monitor_name:^DP-2$,layout_name:scroller

# ============================================
# DP-1 - Philips 4K (secondary)
# ============================================
tagrule=id:1,monitor_name:^DP-1$,layout_name:tile
tagrule=id:2,monitor_name:^DP-1$,layout_name:tile
tagrule=id:3,monitor_name:^DP-1$,layout_name:tile
tagrule=id:4,monitor_name:^DP-1$,layout_name:tile
tagrule=id:5,monitor_name:^DP-1$,layout_name:tile
tagrule=id:6,monitor_name:^DP-1$,layout_name:tile
tagrule=id:7,monitor_name:^DP-1$,layout_name:tile
tagrule=id:8,monitor_name:^DP-1$,layout_name:tile
tagrule=id:9,monitor_name:^DP-1$,layout_name:tile
