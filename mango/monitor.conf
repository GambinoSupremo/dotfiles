# Monitors, matched by EDID model. Positions are logical (Philips 3840/1.5 = 2560 wide).
# SUNSHINE is the stream's virtual output (nixos-config sunshine.nix creates it and sets
# its mode); first so it's the X11 primary while it exists, else the Alienware is.
monitorrule=name:^SUNSHINE$,x:6000,y:0,scale:1,vrr:0,primary:1
# vrr:0 + rule.conf's vrr_only_fullscreen:1 = fullscreen-only VRR (always-on
# VRR gamma-flickers the QD-OLED desktop). Plain sRGB, HDR off (see CLAUDE.md).
monitorrule=model:Dell AW3423DW,width:3440,height:1440,refresh:174,x:0,y:0,scale:1,vrr:0,primary:1
monitorrule=model:PHL 278E1,width:3840,height:2160,refresh:60,x:3440,y:0,scale:1.5,vrr:0
