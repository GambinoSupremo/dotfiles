# Monitors. On NixOS this file is fully REPLACED at build time (home/dotfiles.nix).
# vrr:0 + rule.conf's vrr_only_fullscreen:1 = fullscreen-only VRR (always-on
# VRR gamma-flickers the QD-OLED desktop).
monitorrule=name:DP-2,width:3440,height:1440,refresh:174,x:0,y:0,scale:1,vrr:0
monitorrule=name:DP-1,width:3840,height:2160,refresh:60,x:3440,y:0,scale:1.5,vrr:0
