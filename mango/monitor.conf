# Monitors, matched by EDID model. Positions are logical (Philips 3840/1.5 = 2560 wide).
# SUNSHINE is the stream's virtual output (nixos-config sunshine.nix creates it and sets
# its mode); first so it's the X11 primary while it exists, else the Alienware is.
monitor_rule=name:^SUNSHINE$,x:6000,y:0,scale:1,vrr:0,primary:1
# VRR off: on the RX 9070 XT, fullscreen VRR stutters on this G-SYNC-module monitor
# (same as hypr/monitor.lua). No HDR: the scenefx build can't; only mango's wl-only branch can.
monitor_rule=model:Dell AW3423DW,width:3440,height:1440,refresh:174,x:0,y:0,scale:1,vrr:0,primary:1
monitor_rule=model:PHL 278E1,width:3840,height:2160,refresh:60,x:3440,y:0,scale:1.5,vrr:0
