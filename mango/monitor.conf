# Monitors
#
# NOTE: on NixOS this file is fully REPLACED at build time
# (nixos-config home/dotfiles.nix) with a version that also lists the
# DP-4/DP-3 connector names — the NVIDIA DP index flips with GPU probe
# order. This copy only applies on non-NixOS installs.
monitorrule=name:DP-2,width:3440,height:1440,refresh:174,x:0,y:0,scale:1,vrr:1
monitorrule=name:DP-1,width:3840,height:2160,refresh:60,x:3440,y:0,scale:1.5,vrr:0
