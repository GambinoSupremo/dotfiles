# Window rules — mirrors hypr/rule.lua. Later rules win.
# Monitors matched by EDID model (monitor:model:…), not connector name.

# === Floating Ghostty helper + scratchpad ===
windowrule=isfloating:1,width:900,height:600,appid:^com\.ghostty\.floating$
windowrule=isnamedscratchpad:1,width:0.6,height:0.6,appid:^com\.ghostty\.scratchpad$

# Satty screenshot editor (Super+Shift+S) floats centered
windowrule=isfloating:1,width:0.7,height:0.7,appid:^com\.gabm\.satty$

# === Steam Client ===
# Tag 2 on the Alienware without stealing focus (istagsilent ≈ Hyprland's "silent").
windowrule=tags:2,monitor:model:Dell AW3423DW,istagsilent:1,scroller_proportion:1.0,appid:^steam$
# Secondary Steam windows (properties, settings, toasts) float on the same tag.
windowrule=isfloating:1,appid:^steam$,title:^(?!Steam$)

# === Steam Games ===
windowrule=tags:2,monitor:model:Dell AW3423DW,istagsilent:1,appid:^steam_app_
windowrule=isfloating:0,scroller_proportion:1.0,appid:^steam_app_
# Fullscreen-only VRR (≈ Hyprland vrr=2; needs vrr:0 in the monitorrule) —
# fluctuating desktop refresh gamma-flickers the QD-OLED.
windowrule=vrr_only_fullscreen:1,appid:^steam_app_
# Pre-launch "Launcher" windows (updaters, EAC prompts) share the steam_app_ appid;
# float them at their own size. Proton's placeholder title is "broken".
windowrule=isfloating:1,appid:^steam_app_,title:^(Launcher|broken)$

# === Comms / media → Philips tag 2 (Hyprland workspace 5) ===
windowrule=tags:2,monitor:model:PHL 278E1,istagsilent:1,appid:^(vesktop|signal|Signal|tidal-hifi)$

# === Opacity (same values as hypr/rule.lua) ===
windowrule=focused_opacity:0.95,unfocused_opacity:0.90,appid:^(signal|vesktop|tidal-hifi|cider|obsidian)$
windowrule=focused_opacity:1.0,unfocused_opacity:1.0,appid:^zen-beta$
