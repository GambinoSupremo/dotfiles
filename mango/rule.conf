# ============================================
# Window Rules - MangoWM
# Behavioral rules only.
# Opacity is handled by globals in config.conf
# (focused_opacity=0.95, unfocused_opacity=0.85)
#
# NOTE: monitor:DP-1 below assumes the Philips keeps that connector name.
# The NVIDIA DP index flips with GPU probe order (monitor.conf handles
# both names; these rules don't) — if comms apps stop landing on the
# Philips, check the current names with `mmsg -g` / compositor logs.
# ============================================

# === Floating Terminal ===
windowrule=isfloating:1,width:900,height:600,appid:floating-kitty
windowrule=scroller_proportion:0.25,appid:kitty
windowrule=isfloating:1,width:900,height:600,appid:com.ghostty.floating

# === Steam Client ===
# Full-width in scroller
windowrule=scroller_proportion:1.0,appid:steam

# Steam sub-windows (chat, settings) float on Philips
windowrule=isfloating:1,monitor:DP-1,appid:steam,title:^(?!Steam$)

# Steam notification toasts on Philips
windowrule=isfloating:1,monitor:DP-1,appid:steam,title:^notificationtoasts_\d+_desktop$

# === Steam Games ===
# Tiled in scroller, full-width
windowrule=isfloating:0,appid:steam_app_
windowrule=isfullscreen:0,appid:steam_app_
windowrule=scroller_proportion:1.0,appid:steam_app_

# === Comms Apps -> tag 2 on Philips (DP-1) ===
windowrule=tags:2,monitor:DP-1,appid:vesktop
windowrule=tags:2,monitor:DP-1,appid:signal
windowrule=tags:2,monitor:DP-1,appid:tidal-hifi
