# Window rules — mirrors hypr/rule.lua. Later rules win.
# Monitors matched by EDID model (monitor:model:…), not connector name.

# === Floating Ghostty helper + scratchpad ===
window_rule=is_floating:1,width:900,height:600,app_id:^com\.ghostty\.floating$
window_rule=is_named_scratchpad:1,width:0.6,height:0.6,app_id:^com\.ghostty\.scratchpad$

# Satty screenshot editor (Super+Shift+S) floats centered
window_rule=is_floating:1,width:0.7,height:0.7,app_id:^com\.gabm\.satty$

# === Steam Client ===
# Tag 2 on the Alienware without stealing focus (is_tag_silent ≈ Hyprland's "silent").
window_rule=tags:2,monitor:model:Dell AW3423DW,is_tag_silent:1,scroller_proportion:1.0,app_id:^steam$
# Secondary Steam windows (properties, settings, toasts) float on the same tag.
window_rule=is_floating:1,app_id:^steam$,title:^(?!Steam$)

# === Steam Games ===
window_rule=tags:2,monitor:model:Dell AW3423DW,is_tag_silent:1,app_id:^steam_app_
window_rule=is_floating:0,scroller_proportion:1.0,app_id:^steam_app_
# Pre-launch "Launcher" windows (updaters, EAC prompts) share the steam_app_ appid;
# float them at their own size. Proton's placeholder title is "broken".
window_rule=is_floating:1,app_id:^steam_app_,title:^(Launcher|broken)$

# === Comms / media → Philips tag 2 ===
window_rule=tags:2,monitor:model:PHL 278E1,is_tag_silent:1,app_id:^(vesktop|signal|Signal|tidal-hifi)$

# === Opacity (same values as hypr/rule.lua) ===
window_rule=focused_opacity:0.95,unfocused_opacity:0.90,app_id:^(signal|vesktop|tidal-hifi|cider|obsidian)$
window_rule=focused_opacity:1.0,unfocused_opacity:1.0,app_id:^zen-beta$
