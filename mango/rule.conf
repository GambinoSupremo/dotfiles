# Behavioral window rules (opacity comes from config.conf globals).
# Monitors matched by EDID model (monitor:model:…), not connector name.

# === Floating Terminal ===
windowrule=isfloating:1,width:900,height:600,appid:floating-kitty
windowrule=scroller_proportion:0.25,appid:kitty
windowrule=isfloating:1,width:900,height:600,appid:com.ghostty.floating

# === Steam Client ===
# Tag 2 on the Alienware without stealing focus (istagsilent ≈ Hyprland's "silent").
windowrule=tags:2,monitor:model:Dell AW3423DW,istagsilent:1,appid:steam
# Full-width in scroller
windowrule=scroller_proportion:1.0,appid:steam

# Steam sub-windows (properties, settings) float on the Alienware, same
# monitor+tag as the Steam client/games — they inherit tags:2 from the
# Steam-client rule above, so pinning them to the Philips (which isn't always on
# tag 2) left them floating on a hidden tag: technically open, invisible.
# Confirmed via `mmsg get all-clients` (is_visible:false, is_urgent:true).
windowrule=isfloating:1,monitor:model:Dell AW3423DW,appid:steam,title:^(?!Steam$)

# Steam notification toasts, same reasoning
windowrule=isfloating:1,monitor:model:Dell AW3423DW,appid:steam,title:^notificationtoasts_\d+_desktop$

# === Steam Games ===
# Tag 2 on the Alienware, silent (same as the Steam client rule above)
windowrule=tags:2,monitor:model:Dell AW3423DW,istagsilent:1,appid:steam_app_
# Tiled in scroller, full-width
windowrule=isfloating:0,appid:steam_app_
windowrule=isfullscreen:0,appid:steam_app_
windowrule=scroller_proportion:1.0,appid:steam_app_
# Fullscreen-only VRR (≈ Hyprland vrr=2; needs vrr:0 in the monitorrule) —
# fluctuating desktop refresh gamma-flickers the QD-OLED.
windowrule=vrr_only_fullscreen:1,appid:steam_app_

# Pre-launch "Launcher" windows (updaters, EAC/BattlEye prompts, etc.) share
# the steam_app_ appid with the actual game, so the isfloating:0 rule above
# was force-tiling/fullscreen-ing them too. Float them back to their own
# requested size. Confirmed via `mmsg get all-clients` on Marvel Rivals
# (appid steam_app_2767030): title starts as "broken" (Proton placeholder)
# then flips to "Launcher".
windowrule=isfloating:1,appid:steam_app_,title:^(Launcher|broken)$

# === Comms Apps -> tag 2 on Philips ===
windowrule=tags:2,monitor:model:PHL 278E1,appid:vesktop
windowrule=tags:2,monitor:model:PHL 278E1,appid:signal
windowrule=tags:2,monitor:model:PHL 278E1,appid:tidal-hifi
