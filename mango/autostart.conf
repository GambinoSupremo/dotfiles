# Autostart
#
# NOTE: NixOS deploys a patched copy of this file (nixos-config
# home/dotfiles.nix): the portal line is dropped, the import-environment
# line becomes a session-bootstrap script, and the shell line is removed
# (Noctalia v5 runs as a systemd user service there). Those seds match
# the exact line text below — rewording a matched line fails the NixOS
# build on purpose. Edit both places together.

# Desktop portal for screen sharing and file pickers
exec-once=/usr/lib/xdg-desktop-portal-wlr

# Import Wayland environment into systemd
exec-once=systemctl --user import-environment DISPLAY WAYLAND_DISPLAY XDG_CURRENT_DESKTOP

# Shell
exec-once=qs -c noctalia-shell

# Clipboard
exec-once=wl-paste --watch cliphist store

# Apps
exec-once=sleep 5 && mullvad-exclude vesktop
exec-once=sleep 5 && signal-desktop
exec-once=sleep 5 && tidal-hifi
