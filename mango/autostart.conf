# Autostart. NixOS patches this file (home/dotfiles.nix seds match exact
# lines; rewording a matched line breaks the build).

# Desktop portal for screen sharing and file pickers
exec-once=/usr/lib/xdg-desktop-portal-wlr

# Import Wayland environment into systemd
exec-once=systemctl --user import-environment DISPLAY WAYLAND_DISPLAY XDG_CURRENT_DESKTOP

# Shell
exec-once=qs -c noctalia-shell

# Clipboard
exec-once=wl-paste --watch cliphist store

# Apps
exec-once=sleep 5 && mullvad-exclude vesktop
exec-once=sleep 5 && signal-desktop
exec-once=sleep 5 && tidal-hifi
