# Autostart. nixos-config swaps the import-environment line for its session bootstrap
# (exact-text match; change both together). Noctalia is started by its systemd service.

exec_once=systemctl --user import-environment DISPLAY WAYLAND_DISPLAY XDG_CURRENT_DESKTOP MANGO_INSTANCE_SIGNATURE

exec_once=gsettings set org.gnome.desktop.interface color-scheme 'prefer-dark'
exec_once=wl-paste --watch cliphist store

# Apps (rule.conf puts them on the Philips)
exec_once=sleep 5 && mullvad-exclude vesktop
exec_once=sleep 5 && signal-desktop --password-store=gnome-libsecret
exec_once=sleep 5 && tidal-hifi
