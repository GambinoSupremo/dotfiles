# Keybinds — mirrors hypr/bind.lua. Mango tags are per monitor, so Mod+1..3 are the
# Alienware's tags 1-3 and Mod+4..6 the Philips' tags 1-3 (= Hyprland workspaces 1-6).
# SUPER+Z/X/C/V never reach Mango: keyd turns them into undo/cut/copy/paste.

# === System ===
bind=SUPER,q,killclient,
bind=SUPER+SHIFT+ALT,r,reload_config,
bind=CTRL+ALT,Delete,quit
bind=SUPER,Escape,spawn,noctalia msg panel-toggle session

# === Terminal ===
bind=SUPER,Return,spawn,ghostty
bind=SUPER+CTRL,Return,spawn,ghostty --gtk-single-instance=false --class=com.ghostty.floating

# === Launcher ===
bind=SUPER,space,spawn,noctalia msg panel-toggle launcher

# === App Spawns ===
bind=SUPER+SHIFT,b,spawn,zen-beta
bind=SUPER+SHIFT,e,spawn,nautilus
bind=SUPER+SHIFT,d,spawn,mullvad-exclude vesktop
bind=SUPER+SHIFT,o,spawn,obsidian
bind=SUPER+SHIFT,m,spawn,tidal-hifi
bind=SUPER+SHIFT+ALT,b,spawn,zen-beta --private-window
bind=SUPER+SHIFT,i,spawn,zeditor

# === Noctalia ===
bind=SUPER,backslash,spawn,noctalia msg panel-toggle control-center audio
bind=SUPER+ALT,e,spawn,noctalia msg panel-open launcher /emo
bind=SUPER+ALT,w,spawn,noctalia msg panel-toggle wallpaper
bind=SUPER+ALT,p,spawn,noctalia msg panel-toggle clipboard
bind=SUPER+ALT,r,spawn,systemctl --user restart noctalia.service

# === Screenshots ===
bind=ALT+SHIFT,s,spawn_shell,grim -g "$(slurp)" - | wl-copy
# Noctalia region capture (freezes screen) → Satty annotate; Enter copies, Ctrl+S saves.
bind=SUPER+SHIFT,s,spawn,noctalia msg screenshot-region
bind=NONE,Print,spawn,noctalia msg screenshot-region

# === Window Focus (Arrows + Vim) ===
bind=SUPER,Left,focusdir,left
bind=SUPER,Right,focusdir,right
bind=SUPER,Up,focusdir,up
bind=SUPER,Down,focusdir,down
bind=SUPER,h,focusdir,left
bind=SUPER,l,focusdir,right
bind=SUPER,k,focusdir,up
bind=SUPER,j,focusdir,down

# === Window Movement (Arrows + Vim) ===
bind=SUPER+SHIFT,Left,exchange_client,left
bind=SUPER+SHIFT,Right,exchange_client,right
bind=SUPER+SHIFT,Up,exchange_client,up
bind=SUPER+SHIFT,Down,exchange_client,down
bind=SUPER+SHIFT,h,exchange_client,left
bind=SUPER+SHIFT,l,exchange_client,right
bind=SUPER+SHIFT,k,exchange_client,up
bind=SUPER+SHIFT,j,exchange_client,down

# Flip the focused split between side-by-side and stacked (dwindle)
bind=SUPER,t,dwindle_toggle_split_direction

# === Monitor Focus ===
# focusmon/tagmon directions are inverted on purpose (Left arrow → right monitor) —
# tested on this setup; do not "fix" without testing.
bind=SUPER+CTRL,Left,focusmon,right
bind=SUPER+CTRL,Right,focusmon,left
bind=SUPER+CTRL,h,focusmon,right
bind=SUPER+CTRL,l,focusmon,left

# === Tag Navigation on Current Monitor ===
bind=SUPER+CTRL,Up,viewtoleft,0
bind=SUPER+CTRL,Down,viewtoright,0
bind=SUPER+CTRL,k,viewtoleft,0
bind=SUPER+CTRL,j,viewtoright,0

# === Move Window to Adjacent Monitor ===
bind=SUPER+CTRL+ALT,Left,tagmon,right
bind=SUPER+CTRL+ALT,Right,tagmon,left
bind=SUPER+CTRL+ALT,h,tagmon,right
bind=SUPER+CTRL+ALT,l,tagmon,left

# === Move Window to Adjacent Tag ===
bind=SUPER+CTRL+ALT,Up,tagtoleft,0
bind=SUPER+CTRL+ALT,Down,tagtoright,0
bind=SUPER+CTRL+ALT,k,tagtoleft,0
bind=SUPER+CTRL+ALT,j,tagtoright,0

# === Window States ===
bind=SUPER,w,togglefloating,
bind=SUPER,f,togglefullscreen,
bind=SUPER,m,togglemaximizescreen,
bind=SUPER+SHIFT,g,toggleglobal,
bind=ALT+SHIFT,f,togglefakefullscreen,
bind=SUPER,Tab,toggleoverview,
bind=SUPER,o,toggleoverlay,

# === Alt-Tab ===
bind=ALT,Tab,focusstack,next
bind=ALT+SHIFT,Tab,focusstack,prev

# === Layout (Mango-only) ===
bind=SUPER,n,switch_layout
bind=SUPER+CTRL,s,setlayout,scroller
bind=SUPER+CTRL,a,setlayout,tile
bind=SUPER+CTRL,d,setlayout,dwindle
bind=SUPER,r,switch_proportion_preset,
bind=ALT,e,set_proportion,1.0

# === Resize ===
bind=SUPER,equal,resizewin,50,0
bind=SUPER,minus,resizewin,-50,0
bind=SUPER+SHIFT,equal,resizewin,0,50
bind=SUPER+SHIFT,minus,resizewin,0,-50

# === Scratchpad ===
# Alt+Z: floating Ghostty (spawned on first use). Alt+Shift+Z stashes the focused
# window in the scratchpad, Alt+Ctrl+Z shows the stash.
bind=ALT,z,toggle_named_scratchpad,com.ghostty.scratchpad,none,ghostty --gtk-single-instance=false --class=com.ghostty.scratchpad
bind=ALT+SHIFT,z,minimized
bind=ALT+CTRL,z,toggle_scratchpad

# === Tags (Hyprland workspaces 1-6) ===
bind=SUPER,1,viewcrossmon,1,model:Dell AW3423DW
bind=SUPER,2,viewcrossmon,2,model:Dell AW3423DW
bind=SUPER,3,viewcrossmon,3,model:Dell AW3423DW
bind=SUPER,4,viewcrossmon,1,model:PHL 278E1
bind=SUPER,5,viewcrossmon,2,model:PHL 278E1
bind=SUPER,6,viewcrossmon,3,model:PHL 278E1

bind=SUPER+CTRL,1,tagcrossmon,1,model:Dell AW3423DW
bind=SUPER+CTRL,2,tagcrossmon,2,model:Dell AW3423DW
bind=SUPER+CTRL,3,tagcrossmon,3,model:Dell AW3423DW
bind=SUPER+CTRL,4,tagcrossmon,1,model:PHL 278E1
bind=SUPER+CTRL,5,tagcrossmon,2,model:PHL 278E1
bind=SUPER+CTRL,6,tagcrossmon,3,model:PHL 278E1

# === Mouse Wheel ===
axisbind=SUPER,DOWN,viewtoright_have_client
axisbind=SUPER,UP,viewtoleft_have_client

# === Mouse ===
mousebind=SUPER,btn_left,moveresize,curmove
mousebind=SUPER,btn_right,moveresize,curresize

# === Media ===
bind=NONE,XF86AudioPlay,spawn,playerctl play-pause
bind=NONE,XF86AudioNext,spawn,playerctl next
bind=NONE,XF86AudioPrev,spawn,playerctl prev
bind=NONE,XF86AudioRaiseVolume,spawn,wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
bind=NONE,XF86AudioLowerVolume,spawn,wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bind=NONE,XF86AudioMute,spawn,wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
