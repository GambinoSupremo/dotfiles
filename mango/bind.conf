# ============================================
# Gavin's Unified Keybinds - MangoWM
# Mirrors ~/.config/niri/binds.kdl
#
# NOTE: NixOS deploys a patched copy (nixos-config home/dotfiles.nix):
# /usr/bin paths, v4-era Noctalia IPC calls, and zen-browser are rewritten
# by seds that match the exact line text below. Rewording a matched line
# fails the NixOS build on purpose. Edit both places together.
#
# NOTE: keyd (NixOS, base/services.nix) remaps super+c/super+v to
# Ctrl/Shift+Insert at the kernel level, so the SUPER,c zoom bind below
# likely never fires there.
# ============================================

# === System ===
bind=SUPER,q,killclient,
bind=SUPER+SHIFT+ALT,r,reload_config,
bind=CTRL+ALT,Delete,quit

# === Terminal ===
bind=SUPER,Return,spawn,/usr/bin/ghostty
bind=SUPER+CTRL,Return,spawn,/usr/bin/ghostty --gtk-single-instance=false --class=com.ghostty.floating

# === App Launcher ===
bind=SUPER,space,spawn,qs -c noctalia-shell ipc call launcher toggle

# === App Spawns ===
bind=SUPER+SHIFT,b,spawn,zen-browser
bind=SUPER+SHIFT,e,spawn,nautilus
bind=SUPER+SHIFT,d,spawn,mullvad-exclude vesktop
bind=SUPER+SHIFT,s,spawn,signal-desktop
bind=SUPER+SHIFT,o,spawn,obsidian
bind=SUPER+SHIFT,n,spawn,kitty -e nvim
bind=SUPER+SHIFT,m,spawn,tidal-hifi
bind=SUPER+SHIFT+ALT,b,spawn,zen-browser --private-window
bind=SUPER,z,spawn,zeditor

# === Noctalia ===
bind=SUPER+ALT,e,spawn,qs -c noctalia-shell ipc call launcher emoji
bind=SUPER+ALT,w,spawn,qs -c noctalia-shell ipc call wallpaper toggle
bind=SUPER+ALT,r,spawn,bash -c "pkill -f 'qs.*noctalia' && sleep 1 && qs -c noctalia-shell &"
bind=SUPER,backslash,spawn,noctalia msg panel-toggle control-center audio

# === Screenshots ===
# Mod+S         full screen   -> clipboard
# Alt+Shift+S   region select -> clipboard  (Windows-style "snip")
bind=SUPER,s,spawn,bash -c "grim - | wl-copy"
bind=ALT+SHIFT,s,spawn,bash -c "grim -g \"$(slurp)\" - | wl-copy"

# === Window Focus (Arrows + Vim) ===
bind=SUPER,Left,focusdir,left
bind=SUPER,Right,focusdir,right
bind=SUPER,Up,focusdir,up
bind=SUPER,Down,focusdir,down
bind=SUPER,h,focusdir,left
bind=SUPER,l,focusdir,right
bind=SUPER,k,focusdir,up
bind=SUPER,j,focusdir,down

# === Window Movement (Arrows + Vim) ===
bind=SUPER+SHIFT,Left,exchange_client,left
bind=SUPER+SHIFT,Right,exchange_client,right
bind=SUPER+SHIFT,Up,exchange_client,up
bind=SUPER+SHIFT,Down,exchange_client,down
bind=SUPER+SHIFT,h,exchange_client,left
bind=SUPER+SHIFT,l,exchange_client,right
bind=SUPER+SHIFT,k,exchange_client,up
bind=SUPER+SHIFT,j,exchange_client,down

# === Monitor Focus (Arrows + Vim) ===
# NOTE: focusmon direction is inverted vs intuitive arrow direction.
# Left arrow -> right monitor. This was tested and works on your setup.
# Do not "fix" without testing.
bind=SUPER+CTRL,Left,focusmon,right
bind=SUPER+CTRL,Right,focusmon,left
bind=SUPER+CTRL,h,focusmon,right
bind=SUPER+CTRL,l,focusmon,left

# === Move to Monitor (Arrows + Vim) ===
bind=SUPER+SHIFT+CTRL,Left,tagmon,right
bind=SUPER+SHIFT+CTRL,Right,tagmon,left
bind=SUPER+SHIFT+CTRL,h,tagmon,right
bind=SUPER+SHIFT+CTRL,l,tagmon,left

# === Window States ===
bind=SUPER,w,togglefloating,
bind=SUPER,f,togglefullscreen,
bind=ALT+SHIFT,f,togglefakefullscreen,
bind=SUPER,m,togglemaximizescreen,
bind=SUPER,Tab,toggleoverview,
bind=SUPER,x,toggleoverview,
bind=SUPER,c,zoom,
bind=SUPER,i,minimized,
bind=SUPER+SHIFT,i,restore_minimized
bind=SUPER,o,toggleoverlay,
bind=SUPER+SHIFT,g,toggleglobal,

# === Alt-Tab (cycle windows) ===
bind=ALT,Tab,focusstack,next
bind=ALT+SHIFT,Tab,focusstack,prev

# === Layout (MangoWM-specific, no Niri equivalent) ===
bind=SUPER,n,switch_layout
bind=SUPER+CTRL,s,setlayout,scroller
bind=SUPER+CTRL,a,setlayout,tile
bind=SUPER+CTRL,d,setlayout,center_tile
bind=ALT,e,set_proportion,1.0
bind=ALT,x,switch_proportion_preset,

# === Resize ===
bind=SUPER,r,switch_proportion_preset,
bind=SUPER,equal,resizewin,50,0
bind=SUPER,minus,resizewin,-50,0
bind=SUPER+SHIFT,equal,resizewin,0,50
bind=SUPER+SHIFT,minus,resizewin,0,-50

# === Tags (1-9) ===
# Mod+1..9 view tag, Mod+Ctrl+1..9 send focused window to tag
bind=SUPER,1,view,1,0
bind=SUPER,2,view,2,0
bind=SUPER,3,view,3,0
bind=SUPER,4,view,4,0
bind=SUPER,5,view,5,0
bind=SUPER,6,view,6,0
bind=SUPER,7,view,7,0
bind=SUPER,8,view,8,0
bind=SUPER,9,view,9,0

bind=SUPER+CTRL,1,tag,1,0
bind=SUPER+CTRL,2,tag,2,0
bind=SUPER+CTRL,3,tag,3,0
bind=SUPER+CTRL,4,tag,4,0
bind=SUPER+CTRL,5,tag,5,0
bind=SUPER+CTRL,6,tag,6,0
bind=SUPER+CTRL,7,tag,7,0
bind=SUPER+CTRL,8,tag,8,0
bind=SUPER+CTRL,9,tag,9,0

# === Move Window to Adjacent Tag (keyboard) ===
bind=SUPER+CTRL+ALT,Up,tagtoleft,0
bind=SUPER+CTRL+ALT,Down,tagtoright,0

# === Workspace Scroll (mouse wheel) ===
axisbind=SUPER,UP,viewtoleft_have_client
axisbind=SUPER,DOWN,viewtoright_have_client

# === Move Window Across Tags (mouse wheel) ===
axisbind=SUPER+CTRL,UP,tagtoleft
axisbind=SUPER+CTRL,DOWN,tagtoright

# === Gaps (MangoWM-specific) ===
bind=ALT+SHIFT,x,incgaps,1
bind=ALT+SHIFT,z,incgaps,-1
bind=ALT+SHIFT,r,togglegaps

# === Scratchpad ===
bind=ALT,z,toggle_scratchpad

# === Mouse ===
mousebind=SUPER,btn_left,moveresize,curmove
mousebind=SUPER,btn_right,moveresize,curresize

# === Media Keys ===
bind=NONE,XF86AudioPlay,spawn,playerctl play-pause
bind=NONE,XF86AudioNext,spawn,playerctl next
bind=NONE,XF86AudioPrev,spawn,playerctl prev
bind=NONE,XF86AudioRaiseVolume,spawn,wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
bind=NONE,XF86AudioLowerVolume,spawn,wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bind=NONE,XF86AudioMute,spawn,wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
