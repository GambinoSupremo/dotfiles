# Gavin's Hyprland Config

###################
### MONITORS ###
###################

# Alienware ultrawide (main, right) - PRIMARY
monitor=DP-2,3440x1440@175,0x0,1,bitdepth,10

# Philips 4K (secondary, left)
monitor=DP-1,3840x2160@60,-2560x0,1.5

# Workspace assignments - Main monitor (DP-2)
workspace = 1, monitor:DP-2, default:true
workspace = 2, monitor:DP-2

# Workspace assignments - Left monitor (DP-1)
workspace = 3, monitor:DP-1, default:true
workspace = 4, monitor:DP-1
workspace = 5, monitor:DP-1

# Focus main monitor on start
exec-once = hyprctl dispatch workspace 1
exec-once = xrandr --output DP-2 --primary

###################
### PROGRAMS ###
###################

$terminal = ghostty
$fileManager = nautilus
$menu = rofi -show drun
$browser = zen-browser

###################
### AUTOSTART ###
###################
exec-once = waybar
exec-once = mako
exec-once = /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1
exec-once = swww-daemon
exec-once = sleep 1 && ~/.local/bin/wallpaper.sh
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store

#############################
### ENVIRONMENT VARIABLES ###
#############################

env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24
env = QT_QPA_PLATFORMTHEME,qt6ct
env = GTK_THEME,Adwaita:dark
env = DXVK_HDR,1

# Wayland compatibility
env = GDK_BACKEND,wayland,x11,*
env = QT_QPA_PLATFORM,wayland;xcb
env = SDL_VIDEODRIVER,wayland
env = MOZ_ENABLE_WAYLAND,1
env = ELECTRON_OZONE_PLATFORM_HINT,wayland
env = OZONE_PLATFORM,wayland
env = XDG_SESSION_TYPE,wayland

# Portal/Desktop integration
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_DESKTOP,Hyprland

# Nvidia environment variables
env = NVD_BACKEND,direct
env = LIBVA_DRIVER_NAME,nvidia
env = __GLX_VENDOR_LIBRARY_NAME,nvidia
env = GBM_BACKEND,nvidia-drm
env = WLR_NO_HARDWARE_CURSORS,1
env = PROTON_ENABLE_NVAPI,1

#####################
### LOOK AND FEEL ###
#####################

general {
    gaps_in = 5
    gaps_out = 10
    border_size = 2
    col.active_border = rgba(a7c080ff) rgba(83c092ff) 45deg
    col.inactive_border = rgba(3d484dff)
    layout = dwindle
}

decoration {
    rounding = 8
    blur {
        enabled = true
        size = 8
        passes = 2
    }
    shadow {
        enabled = true
        range = 15
        render_power = 3
        color = rgba(1e222699)
    }
}

animations {
    enabled = true
    bezier = myBezier, 0.05, 0.9, 0.1, 1.05
    animation = windows, 1, 7, myBezier
    animation = windowsOut, 1, 7, default, popin 80%
    animation = border, 1, 10, default
    animation = fade, 1, 7, default
    animation = workspaces, 1, 6, default
}

dwindle {
    pseudotile = true
    preserve_split = true
}

input {
    kb_layout = us
    follow_mouse = 1
    sensitivity = 0
}

###################
### KEYBINDINGS ###
###################

$mainMod = SUPER

# Core
bind = $mainMod, Return, exec, $terminal
bind = $mainMod, W, killactive,
bind = $mainMod, M, exit,
bind = $mainMod, E, exec, $fileManager
bind = $mainMod SHIFT,  V, togglefloating,
bind = $mainMod, P, pseudo,
bind = $mainMod, J, togglesplit,
bind = $mainMod, F, fullscreen,
bind = $mainMod, Space, exec, $menu

# Apps
bind = $mainMod SHIFT, B, exec, zen-browser
bind = $mainMod SHIFT, F, exec, nautilus
bind = $mainMod SHIFT, M, exec, tidal-hifi
bind = $mainMod SHIFT, T, exec, $terminal -e btop
bind = $mainMod SHIFT, D, exec, vesktop
bind = $mainMod SHIFT, S, exec, signal-desktop
bind = $mainMod SHIFT, O, exec, obsidian
bind = $mainMod SHIFT, A, exec, zen-browser --new-window https://chatgpt.com
bind = $mainMod SHIFT, Y, exec, zen-browser --new-window https://youtube.com

# Alt Launch
bind = $mainMod SHIFT ALT, B, exec, zen-browser --private-window

# Screenshots
bind = , Print, exec, grim -g "$(slurp)" - | wl-copy
bind = SHIFT, Print, exec, grim -g "$(slurp)" - | satty -f -
bind = ALT SHIFT, S, exec, grim -g "$(slurp)" - | wl-copy
bind = CTRL SHIFT, S, exec, grim -g "$(slurp)" - | satty -f -

# Universal clipboard (Omarchy-style)
bind = $mainMod, C, sendshortcut, CTRL, Insert,
bind = $mainMod, V, sendshortcut, SHIFT, Insert,
bind = $mainMod, X, sendshortcut, CTRL, X,
bind = $mainMod CTRL, V, exec, cliphist list | rofi -dmenu -p "Clipboard" | cliphist decode | wl-copy

# Media keys
bind = , XF86AudioRaiseVolume, exec, pamixer -i 5
bind = , XF86AudioLowerVolume, exec, pamixer -d 5
bind = , XF86AudioMute, exec, pamixer -t
bind = , XF86AudioPlay, exec, playerctl play-pause
bind = , XF86AudioNext, exec, playerctl next
bind = , XF86AudioPrev, exec, playerctl previous

# Media with Ctrl+Super+Arrow
bind = CTRL $mainMod, Right, exec, playerctl next
bind = CTRL $mainMod, Left, exec, playerctl previous
bind = CTRL $mainMod, Up, exec, pamixer -i 5
bind = CTRL $mainMod, Down, exec, playerctl play-pause

# Brightness
bind = , XF86MonBrightnessUp, exec, brightnessctl set +5%
bind = , XF86MonBrightnessDown, exec, brightnessctl set 5%-

# Wallpaper
bind = $mainMod CTRL, Space, exec, ~/.local/bin/wallpaper.sh

# Move focus
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# Switch workspaces
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Move window to workspace
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# Scroll through workspaces
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# Move/resize with mouse
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

##############################
### GAMING WINDOW RULES ###
##############################

windowrulev2 = monitor DP-2, class:^(steam_app_.*)$
windowrulev2 = monitor DP-2, class:^(gamescope)$
windowrulev2 = monitor DP-2, class:^(steam)$
windowrulev2 = workspace 2, class:^(steam)$
windowrulev2 = workspace 2, class:^(steam_app_.*)$
windowrulev2 = immediate, class:^(steam_app_.*)$
windowrulev2 = immediate, class:^(gamescope)$

##############################
### STEAM FIXES ###
##############################

windowrulev2 = stayfocused, title:^()$,class:^(steam)$
windowrulev2 = minsize 1 1, title:^()$,class:^(steam)$
windowrulev2 = monitor DP-2, class:^(steam)$
windowrulev2 = workspace 2, class:^(steam)$
windowrulev2 = monitor DP-2, class:^(steam)$, title:^(notificationtoasts).*
windowrulev2 = move 3100 50, class:^(steam)$, title:^(notificationtoasts).*
windowrulev2 = workspace unset, class:^(steam)$, title:^(notificationtoasts).*
