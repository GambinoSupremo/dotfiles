# Starship prompt layout.
# On NixOS this file is not symlinked: an activation script (nixos-config
# home/dotfiles.nix) merges this layout with the Noctalia-generated palette
# block into a writable ~/.config/starship.toml on every rebuild. The
# palette block markers (>>> NOCTALIA STARSHIP PALETTE) are load-bearing.

palette = "noctalia"
# Two-line prompt
format = """
[](bg:transparent fg:purple)$os[](fg:purple bg:cyan)$directory$git_branch$git_status$git_metrics[](fg:cyan bg:transparent)$status
$character
"""

[status]
disabled = false
symbol = "✘"
style = "fg:red bg:transparent"
format = "[ $status$symbol]($style)"

[os]
disabled = false
format = "[$symbol ]($style)"
#style = "bg:bright-purple fg:black"
style = "bg:purple fg:#11131a"

[os.symbols]
Alpine = "󰢛"
Arch = "󰣇"
CachyOS = "󰣇"
Debian = "󰣚"
EndeavourOS = ""
Fedora = "󰣛"
Gentoo = "󰣨"
Macos = "󰀵"
Manjaro = ""
Mint = "󰣭"
NixOS = "󱄅"
openSUSE = ""
Pop = ""
Raspbian = "󰐿"
Redhat = "󱄛"
RedHatEnterprise = "󱄛"
RockyLinux = ""
Ubuntu = "󰕈"
Void = ""
Linux = "󰌽"

[time]
disabled = true
time_format = "%R"
style = "bg:white fg:black"
format = "[ 󱑍 $time ]($style)"

[directory]
format = "[ $path ]($style)"
style = "fg:#11131a bg:cyan"
home_symbol = "~"
truncation_symbol = "…/"
truncate_to_repo = false
read_only = ""

[git_branch]
format = "[| $symbol$branch]($style)"
symbol = "  "
style = "fg:#11131a bg:cyan"

[git_status]
# Show only if there is status output
format = "([$all_status]($style))"
style = "fg:purple bg:cyan"

[git_metrics]
format = "([ +$added]($added_style))([ -$deleted]($deleted_style))"
only_nonzero_diffs = true
added_style = "fg:#11131a bg:cyan"
deleted_style = "fg:black bg:cyan"
disabled = false






















































































































































































































